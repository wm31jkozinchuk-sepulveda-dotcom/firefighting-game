<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Firestorm Response - Chromebook Optimized</title>
  <style>
    :root {
      --bg: #07131f;
      --panel: rgba(11, 18, 25, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #ecf2f9;
      --muted: #a5b5c8;
      --danger: #ff5555;
      --good: #66dd88;
      --warning: #ffb347;
      --water: #4ab8ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060d15;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    #gameContainer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a121a;
    }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left {
      position: fixed;
      left: 10px;
      top: 10px;
      width: 280px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 100;
      font-size: 13px;
    }

    .hud-title {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .stat-value {
      display: block;
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      margin-top: 4px;
    }

    .vehicle-status {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      display: none;
    }

    .vehicle-status.active {
      display: block;
      border-color: rgba(74, 184, 255, 0.3);
      background: rgba(74, 184, 255, 0.08);
    }

    .vehicle-info {
      color: var(--text);
      font-weight: bold;
      margin-bottom: 4px;
    }

    .water-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .water-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ab8ff, #2a8fff);
      border-radius: 3px;
      transition: width 0.1s;
    }

    .hud-right {
      position: fixed;
      right: 10px;
      top: 10px;
      width: 240px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 100;
    }

    .command-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .cmd-btn {
      flex: 1;
      min-width: 50px;
      padding: 6px 8px;
      background: rgba(42, 130, 255, 0.12);
      border: 1px solid rgba(42, 130, 255, 0.3);
      color: var(--text);
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.15s;
      pointer-events: auto;
    }

    .cmd-btn:hover {
      background: rgba(42, 130, 255, 0.22);
      border-color: rgba(42, 130, 255, 0.5);
    }

    .dispatch-log {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      max-height: 160px;
      overflow-y: auto;
      padding: 8px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
    }

    .dispatch-line {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .dispatch-line:last-child {
      border-bottom: none;
    }

    .map-widget {
      position: fixed;
      left: 10px;
      bottom: 10px;
      width: 200px;
      height: 140px;
      background: rgba(10, 16, 24, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 100;
      overflow: hidden;
    }

    .map-widget canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chat-bottom {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 20px));
      background: rgba(8, 14, 20, 0.88);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      z-index: 105;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .msg-area {
      max-height: 140px;
      overflow-y: auto;
      padding: 8px 10px 6px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .msg-line {
      padding: 2px 0;
    }

    .msg-sender {
      color: var(--text);
      font-weight: bold;
    }

    .chat-input-row {
      display: flex;
      background: rgba(255,255,255,0.01);
    }

    .chat-input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      padding: 10px 12px;
      font-family: inherit;
    }

    .chat-input-row input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .send-btn {
      background: linear-gradient(135deg, #2a82ff 0%, #1d5acb 100%);
      border: none;
      color: white;
      cursor: pointer;
      padding: 0 14px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 0.3px;
      pointer-events: auto;
      transition: 0.15s;
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #3a8fff 0%, #2565d8 100%);
    }

    .crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 15;
    }

    .crosshair-h, .crosshair-v {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
    }

    .crosshair-h {
      width: 20px;
      height: 2px;
      left: 0;
      top: 9px;
    }

    .crosshair-v {
      width: 2px;
      height: 20px;
      left: 9px;
      top: 0;
    }

    .help-overlay {
      position: fixed;
      bottom: 160px;
      right: 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 220px;
      z-index: 95;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      opacity: 0.9;
      display: none;
    }

    .vehicle-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      z-index: 200;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      display: none;
    }

    .vehicle-panel.active {
      display: block;
    }

    .panel-header {
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .vehicle-list {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .vehicle-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      pointer-events: auto;
    }

    .vehicle-item:hover {
      background: rgba(42, 130, 255, 0.15);
      border-color: rgba(42, 130, 255, 0.3);
    }

    .vehicle-item-type {
      font-weight: bold;
      color: var(--text);
      margin-bottom: 4px;
    }

    .vehicle-item-dist {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .vehicle-item-water {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .vehicle-mini-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .vehicle-mini-fill {
      height: 100%;
      background: #4ab8ff;
      border-radius: 2px;
    }

    .close-btn {
      width: 100%;
      padding: 8px;
      background: rgba(255, 85, 85, 0.15);
      border: 1px solid rgba(255, 85, 85, 0.3);
      color: var(--danger);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      pointer-events: auto;
      transition: 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 85, 85, 0.25);
      border-color: rgba(255, 85, 85, 0.5);
    }

    .boarding-prompt {
      position: fixed;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 2px solid rgba(102, 221, 136, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--good);
      z-index: 110;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      display: none;
    }

    .boarding-prompt.active {
      display: block;
      animation: pulse-border 1s infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(102, 221, 136, 0.4); }
      50% { border-color: rgba(102, 221, 136, 0.8); }
    }

    @media (max-width: 768px) {
      .hud-left, .hud-right { width: 220px; }
      .map-widget { width: 160px; height: 110px; }
      .chat-bottom { width: calc(100vw - 20px); }
      .vehicle-panel { width: 280px; }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="overlay">
    <div class="crosshair">
      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>
    </div>

    <div class="hud-left">
      <div class="hud-title">Fireground Command</div>
      <div class="stat-grid">
        <div class="stat">
          Active Fires
          <span class="stat-value" id="fireCount">0</span>
        </div>
        <div class="stat">
          Civilians
          <span class="stat-value" id="civCount">0</span>
        </div>
        <div class="stat">
          Units
          <span class="stat-value" id="unitCount">0</span>
        </div>
        <div class="stat">
          Score
          <span class="stat-value" id="scoreCount">0</span>
        </div>
      </div>
      <div class="vehicle-status" id="vehicleStatus">
        <div class="vehicle-info" id="vehicleType"></div>
        <div style="font-size: 10px; margin-bottom: 4px;">Water Tank</div>
        <div class="water-bar">
          <div class="water-fill" id="waterBar" style="width: 100%"></div>
        </div>
        <button class="close-btn" id="exitBtn" style="margin-top: 8px;">Exit Vehicle [X]</button>
      </div>
    </div>

    <div class="hud-right">
      <div class="hud-title">Quick Commands</div>
      <div class="command-buttons">
        <button class="cmd-btn" data-cmd="status">Status</button>
        <button class="cmd-btn" data-cmd="air">Air</button>
        <button class="cmd-btn" data-cmd="ground">Ground</button>
        <button class="cmd-btn" data-cmd="help">Help</button>
      </div>
      <div class="hud-title">Dispatch Log</div>
      <div id="dispatchLog" class="dispatch-log"></div>
    </div>

    <div class="map-widget">
      <canvas id="minimapCanvas"></canvas>
    </div>

    <div class="help-overlay" id="helpText"></div>

    <div class="boarding-prompt" id="boardingPrompt"></div>
  </div>

  <div class="vehicle-panel" id="vehiclePanel">
    <div class="panel-header">Select Vehicle</div>
    <div id="vehicleList" class="vehicle-list"></div>
  </div>

  <div class="chat-bottom">
    <div id="chatMessages" class="msg-area"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Talk to dispatch..." />
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@r158/build/three.module.js";

    // ========== SETUP ==========
    const canvas = document.getElementById("gameCanvas");
    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      antialias: false,
      powerPreference: "low-power"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = false;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a121a, 120, 200);
    scene.background = new THREE.Color(0x0a121a);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 1.7, 15);

    const clock = new THREE.Clock();

    const WORLD = { size: 200, fireSpread: 0.15 };

    const gameState = {
      fires: [],
      civilians: [],
      vehicles: [],
      fuelStations: [],
      firePumps: [],
      score: 0,
      lastDispatchTime: 0,
      chatHistory: [],
      playerInVehicle: null,
      nearbyVehicles: []
    };

    const player = {
      pos: new THREE.Vector3(0, 1.7, 15),
      yaw: 0,
      pitch: 0,
      moveSpeed: 18,
      keys: {}
    };

    // ========== UI ==========
    const ui = {
      fireCount: document.getElementById("fireCount"),
      civCount: document.getElementById("civCount"),
      unitCount: document.getElementById("unitCount"),
      scoreCount: document.getElementById("scoreCount"),
      chatMessages: document.getElementById("chatMessages"),
      chatInput: document.getElementById("chatInput"),
      dispatchLog: document.getElementById("dispatchLog"),
      helpText: document.getElementById("helpText"),
      vehiclePanel: document.getElementById("vehiclePanel"),
      vehicleList: document.getElementById("vehicleList"),
      boardingPrompt: document.getElementById("boardingPrompt"),
      vehicleStatus: document.getElementById("vehicleStatus"),
      vehicleType: document.getElementById("vehicleType"),
      waterBar: document.getElementById("waterBar"),
      exitBtn: document.getElementById("exitBtn")
    };

    function updateHud() {
      ui.fireCount.textContent = gameState.fires.length;
      ui.civCount.textContent = gameState.civilians.length;
      ui.unitCount.textContent = gameState.vehicles.length;
      ui.scoreCount.textContent = gameState.score;

      if (gameState.playerInVehicle) {
        const v = gameState.playerInVehicle;
        ui.vehicleStatus.classList.add("active");
        ui.vehicleType.textContent = v.type.toUpperCase() + " OPERATIONAL";
        ui.waterBar.style.width = Math.max(0, Math.min(100, (v.water / (v.type === "truck" ? 70 : 45)) * 100)) + "%";
      } else {
        ui.vehicleStatus.classList.remove("active");
      }
    }

    function addDispatchMessage(text, severity = "info") {
      const line = document.createElement("div");
      line.className = "dispatch-line";
      line.textContent = text;
      line.style.color = severity === "danger" ? "#ff8888" : severity === "good" ? "#88dd88" : "#b5c9dd";
      ui.dispatchLog.insertBefore(line, ui.dispatchLog.firstChild);
      while (ui.dispatchLog.children.length > 6) {
        ui.dispatchLog.removeChild(ui.dispatchLog.lastChild);
      }
    }

    function addChatMessage(sender, text) {
      const line = document.createElement("div");
      line.className = "msg-line";
      line.innerHTML = `<span class="msg-sender">${sender}:</span> <span style="color:#d5e0ed">${text}</span>`;
      ui.chatMessages.appendChild(line);
      ui.chatMessages.scrollTop = ui.chatMessages.scrollHeight;
      gameState.chatHistory.push({ sender, text });
      if (gameState.chatHistory.length > 20) gameState.chatHistory.shift();
    }

    function showHelp() {
      ui.helpText.innerHTML = `<b>Controls:</b><br>WASD - move<br>Mouse - look<br>Shift - sprint<br>E - call vehicles / board<br>X - exit vehicle<br>Click UI buttons for commands`;
      ui.helpText.style.display = "block";
      setTimeout(() => { ui.helpText.style.display = "none"; }, 4000);
    }

    // ========== WORLD ==========
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d5a3a });
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(WORLD.size, WORLD.size, 2, 2),
      groundMat
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Roads
    for (let i = -7; i <= 7; i++) {
      const roadMat = new THREE.MeshLambertMaterial({ color: 0x3a3f44 });
      const roadX = new THREE.Mesh(
        new THREE.BoxGeometry(7, 0.06, WORLD.size),
        roadMat
      );
      roadX.position.set(i * 14, 0.03, 0);
      scene.add(roadX);

      const roadZ = new THREE.Mesh(
        new THREE.BoxGeometry(WORLD.size, 0.06, 7),
        roadMat
      );
      roadZ.position.set(0, 0.03, i * 14);
      scene.add(roadZ);
    }

    // Buildings - low poly
    function createBuilding(x, z, w, d, h) {
      const mat = new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x8a9aaa : 0x7a89a0 });
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      b.position.set(x, h / 2, z);
      scene.add(b);
    }

    for (let i = 0; i < 20; i++) {
      let x = Math.random() * 160 - 80;
      let z = Math.random() * 160 - 80;
      if (Math.abs(x) < 18 && Math.abs(z) < 18) continue;
      createBuilding(x, z, 12 + Math.random() * 8, 12 + Math.random() * 8, 10 + Math.random() * 12);
    }

    // Fuel Stations
    function createFuelStation(x, z) {
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(3.5, 3.5, 1.5, 8),
        new THREE.MeshLambertMaterial({ color: 0x5a8a6a })
      );
      base.position.set(x, 0.75, z);
      scene.add(base);

      gameState.fuelStations.push({ x, z, radius: 8 });
    }

    [[-60, -60], [60, -60], [-70, 65], [70, 65], [0, 80], [0, -80]].forEach(([x, z]) => {
      createFuelStation(x, z);
    });

    // Fire Pumps
    function createFirePump(x, z) {
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(2.2, 2.2, 1.8, 8),
        new THREE.MeshLambertMaterial({ color: 0x3d5a72 })
      );
      base.position.set(x, 0.9, z);
      scene.add(base);

      gameState.firePumps.push({ x, z, radius: 10, water: 100 });
    }

    [[-40, -15], [40, -15], [-30, 35], [30, 35], [0, 0]].forEach(([x, z]) => {
      createFirePump(x, z);
    });

    // ========== FIRE SYSTEM ==========
    function createFire(x, z, intensity = 1) {
      const fireGroup = new THREE.Group();

      // Simplified flame
      const flameGeo = new THREE.ConeGeometry(2, 5, 6);
      const flameMat = new THREE.MeshLambertMaterial({ color: 0xff8833 });
      const flame = new THREE.Mesh(flameGeo, flameMat);
      flame.position.y = 2.5;
      fireGroup.add(flame);

      fireGroup.position.set(x, 0, z);
      scene.add(fireGroup);

      const fire = {
        x, z,
        mesh: fireGroup,
        intensity,
        radius: 9,
        active: true,
        spreadTimer: 0
      };
      gameState.fires.push(fire);
      return fire;
    }

    function spawnRandomFire() {
      let x = Math.random() * 160 - 80;
      let z = Math.random() * 160 - 80;
      if (Math.abs(x) < 18 && Math.abs(z) < 18) {
        x += 30;
        z += 20;
      }
      createFire(x, z, 0.7 + Math.random() * 0.8);
      addDispatchMessage(`Fire reported at (${Math.round(x)}, ${Math.round(z)})`, "danger");
    }

    for (let i = 0; i < 6; i++) spawnRandomFire();

    // ========== CIVILIANS ==========
    function createCivilian(x, z) {
      const personMat = new THREE.MeshLambertMaterial({ color: 0xf0d8ac });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.4, 4, 6), personMat);
      body.position.set(x, 0.8, z);
      scene.add(body);

      gameState.civilians.push({ x, z, mesh: body, safe: false });
    }

    for (let i = 0; i < 12; i++) {
      createCivilian(Math.random() * 140 - 70, Math.random() * 140 - 70);
    }

    // ========== VEHICLES ==========
    function buildVehicle(type, x, z) {
      const group = new THREE.Group();
      let mat, speed, water, radius;

      if (type === "plane") {
        const body = new THREE.Mesh(
          new THREE.ConeGeometry(2.5, 8, 6),
          new THREE.MeshLambertMaterial({ color: 0xd9e3f7 })
        );
        body.rotation.z = -Math.PI / 2;
        body.position.y = 2.8;
        group.add(body);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(9, 0.4, 1.6), new THREE.MeshLambertMaterial({ color: 0x6d7d94 }));
        wing.position.y = 2.5;
        group.add(wing);

        speed = 16;
        water = 50;
        radius = 14;
      } else if (type === "helicopter") {
        const body = new THREE.Mesh(
          new THREE.CapsuleGeometry(1.6, 4, 4, 8),
          new THREE.MeshLambertMaterial({ color: 0xc9dff5 })
        );
        body.rotation.z = Math.PI / 2;
        body.position.y = 3.6;
        group.add(body);

        const rotor = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.2, 0.4), new THREE.MeshLambertMaterial({ color: 0x5a6d7f }));
        rotor.position.y = 5.8;
        group.add(rotor);

        speed = 14;
        water = 45;
        radius = 12;
      } else if (type === "truck") {
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2, 2), new THREE.MeshLambertMaterial({ color: 0xd47a52 }));
        body.position.y = 1.8;
        group.add(body);

        const tank = new THREE.Mesh(new THREE.BoxGeometry(2, 2.2, 1.8), new THREE.MeshLambertMaterial({ color: 0x3a4a5a }));
        tank.position.set(-0.8, 2.2, 0);
        group.add(tank);

        speed = 9;
        water = 70;
        radius = 11;
      } else {
        const body = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 1.8), new THREE.MeshLambertMaterial({ color: 0x7a9aba }));
        body.position.y = 1.2;
        group.add(body);

        speed = 7;
        water = 40;
        radius = 10;
      }

      group.position.set(x, 0, z);
      scene.add(group);

      const vehicle = {
        type,
        x, z,
        mesh: group,
        water,
        maxWater: (type === "truck" ? 70 : type === "plane" ? 50 : type === "helicopter" ? 45 : 40),
        speed,
        radius,
        target: { x: Math.random() * 140 - 70, z: Math.random() * 140 - 70 }
      };
      gameState.vehicles.push(vehicle);
      return vehicle;
    }

    ["plane", "helicopter", "truck", "truck", "car", "car", "truck"].forEach((type) => {
      buildVehicle(type, Math.random() * 120 - 60, Math.random() * 120 - 60);
    });

    // ========== AI & LOGIC ==========
    function dist2D(a, b) {
      return Math.hypot(a.x - b.x, a.z - b.z);
    }

    function findNearestFire(x, z) {
      let best = null, minD = Infinity;
      for (const fire of gameState.fires) {
        const d = dist2D({ x, z }, fire);
        if (d < minD) { minD = d; best = fire; }
      }
      return best;
    }

    function findNearestStation(x, z) {
      let best = null, minD = Infinity;
      for (const st of gameState.fuelStations) {
        const d = Math.hypot(x - st.x, z - st.z);
        if (d < minD) { minD = d; best = st; }
      }
      return best;
    }

    function updateVehicleAI(v, dt) {
      // If player is in vehicle, don't do AI
      if (gameState.playerInVehicle === v) {
        return;
      }

      const fire = findNearestFire(v.x, v.z);

      if (fire && v.water > 0) {
        const d = dist2D({ x: v.x, z: v.z }, fire);
        if (d < v.radius + 8) {
          fire.intensity -= 0.6 * dt;
          v.water -= 2.5 * dt;
          if (fire.intensity <= 0) {
            fire.active = false;
            scene.remove(fire.mesh);
            gameState.fires = gameState.fires.filter(f => f !== fire);
            gameState.score += 12;
            addDispatchMessage("Fire contained", "good");
          }
        } else {
          const dx = fire.x - v.x;
          const dz = fire.z - v.z;
          const dist = Math.hypot(dx, dz) || 1;
          v.x += (dx / dist) * v.speed * dt;
          v.z += (dz / dist) * v.speed * dt;
        }
      } else if (v.water <= 0) {
        const st = findNearestStation(v.x, v.z);
        if (st && Math.hypot(v.x - st.x, v.z - st.z) < 5) {
          v.water = v.maxWater;
        } else if (st) {
          const d = Math.hypot(v.x - st.x, v.z - st.z);
          v.x += ((st.x - v.x) / d) * v.speed * dt * 0.6;
          v.z += ((st.z - v.z) / d) * v.speed * dt * 0.6;
        }
      } else {
        const dx = v.target.x - v.x;
        const dz = v.target.z - v.z;
        const d = Math.hypot(dx, dz);
        if (d < 4) {
          v.target = { x: Math.random() * 140 - 70, z: Math.random() * 140 - 70 };
        } else {
          v.x += (dx / d) * v.speed * dt * 0.5;
          v.z += (dz / d) * v.speed * dt * 0.5;
        }
      }

      v.mesh.position.x = v.x;
      v.mesh.position.z = v.z;
      if (v.type === "plane" || v.type === "helicopter") {
        v.mesh.position.y = 16 + Math.sin(performance.now() * 0.003 + v.x * 0.01) * 2.5;
      }
    }

    function updateCivilians(dt) {
      for (const civ of gameState.civilians) {
        for (const fire of gameState.fires) {
          if (dist2D(civ, fire) < fire.radius + 5) {
            civ.x += (0 - civ.x) * 0.018 * dt * 60;
            civ.z += (0 - civ.z) * 0.018 * dt * 60;
            break;
          }
        }
        civ.mesh.position.x = civ.x;
        civ.mesh.position.z = civ.z;
      }
    }

    function updateFireSpread(dt) {
      for (const fire of gameState.fires) {
        fire.intensity += (Math.random() * 0.05 - 0.025) * dt * 60;
        fire.intensity = Math.max(0.3, Math.min(1.8, fire.intensity));
        fire.spreadTimer += dt;

        if (fire.spreadTimer > 2 && Math.random() < 0.15) {
          fire.spreadTimer = 0;
          const nx = fire.x + (Math.random() - 0.5) * 12;
          const nz = fire.z + (Math.random() - 0.5) * 12;
          if (Math.abs(nx) < 95 && Math.abs(nz) < 95 && !gameState.fires.some(f => dist2D(f, { x: nx, z: nz }) < 4)) {
            createFire(nx, nz, 0.6 + Math.random() * 0.5);
          }
        }
      }

      if (Math.random() < 0.012) spawnRandomFire();
    }

    // ========== VEHICLE CONTROL ==========
    function findNearbyVehicles(x, z, maxDist = 20) {
      return gameState.vehicles.filter(v => dist2D({ x, z }, v) < maxDist);
    }

    function showVehicleSelectPanel() {
      const nearby = findNearbyVehicles(player.pos.x, player.pos.z, 25);
      gameState.nearbyVehicles = nearby;

      ui.vehicleList.innerHTML = "";

      if (nearby.length === 0) {
        ui.boardingPrompt.textContent = "No vehicles nearby. Press E to call.";
        ui.boardingPrompt.classList.add("active");
        setTimeout(() => ui.boardingPrompt.classList.remove("active"), 3000);
        return;
      }

      nearby.forEach((v, idx) => {
        const item = document.createElement("div");
        item.className = "vehicle-item";
        const dist = Math.hypot(player.pos.x - v.x, player.pos.z - v.z).toFixed(1);
        const waterPct = Math.round((v.water / v.maxWater) * 100);
        
        item.innerHTML = `
          <div class="vehicle-item-type">${idx + 1}. ${v.type.toUpperCase()}</div>
          <div class="vehicle-item-dist">Distance: ${dist}m</div>
          <div class="vehicle-item-water">Water: ${waterPct}%</div>
          <div class="vehicle-mini-bar">
            <div class="vehicle-mini-fill" style="width: ${waterPct}%"></div>
          </div>
        `;

        item.addEventListener("click", () => {
          boardVehicle(v);
        });

        ui.vehicleList.appendChild(item);
      });

      ui.vehiclePanel.classList.add("active");
    }

    function boardVehicle(vehicle) {
      gameState.playerInVehicle = vehicle;
      ui.vehiclePanel.classList.remove("active");
      addChatMessage("You", `Boarded ${vehicle.type}. Engaging fire suppression systems.`);
      addDispatchMessage(`Player aboard ${vehicle.type}`, "good");
    }

    function exitVehicle() {
      if (!gameState.playerInVehicle) return;
      
      const v = gameState.playerInVehicle;
      player.pos.x = v.x + 3;
      player.pos.z = v.z + 3;
      
      addChatMessage("You", `Exiting ${v.type}.`);
      addDispatchMessage("Player disembarked", "info");
      gameState.playerInVehicle = null;
    }

    function operateVehicle(v, dt) {
      // Player controls the vehicle
      const fwd = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

      let move = new THREE.Vector3();
      if (player.keys["KeyW"]) move.addScaledVector(fwd, 1);
      if (player.keys["KeyS"]) move.addScaledVector(fwd, -1);
      if (player.keys["KeyA"]) move.addScaledVector(right, -1);
      if (player.keys["KeyD"]) move.addScaledVector(right, 1);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(v.speed * dt);
        v.x += move.x;
        v.z += move.z;
      }

      // Auto-extinguish nearby fires
      const fire = findNearestFire(v.x, v.z);
      if (fire && v.water > 0) {
        const d = dist2D({ x: v.x, z: v.z }, fire);
        if (d < v.radius + 8) {
          fire.intensity -= 1.2 * dt;
          v.water -= 3.5 * dt;
          if (fire.intensity <= 0) {
            fire.active = false;
            scene.remove(fire.mesh);
            gameState.fires = gameState.fires.filter(f => f !== fire);
            gameState.score += 25;
            addDispatchMessage("Fire suppressed by player vehicle", "good");
          }
        }
      }

      // Refuel at station
      const st = findNearestStation(v.x, v.z);
      if (st && v.water < v.maxWater && Math.hypot(v.x - st.x, v.z - st.z) < 5) {
        v.water = v.maxWater;
        addDispatchMessage("Vehicle refueled", "good");
      }

      // Clamp position
      v.x = Math.max(-95, Math.min(95, v.x));
      v.z = Math.max(-95, Math.min(95, v.z));

      v.mesh.position.x = v.x;
      v.mesh.position.z = v.z;
      if (v.type === "plane" || v.type === "helicopter") {
        v.mesh.position.y = 16 + Math.sin(performance.now() * 0.003 + v.x * 0.01) * 2.5;
      }

      // Update player position relative to vehicle
      player.pos.x = v.x;
      player.pos.z = v.z;
      if (v.type === "plane" || v.type === "helicopter") {
        player.pos.y = v.mesh.position.y + 1;
      } else {
        player.pos.y = 1.7;
      }
    }

    // ========== INPUT ==========
    let pointerLocked = false;

    canvas.addEventListener("click", () => {
      if (!pointerLocked) canvas.requestPointerLock?.();
    });

    document.addEventListener("pointerlockchange", () => {
      pointerLocked = document.pointerLockElement === canvas;
    });

    document.addEventListener("mousemove", (e) => {
      if (!pointerLocked) return;
      player.yaw -= e.movementX * 0.002;
      player.pitch -= e.movementY * 0.0016;
      player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
    });

    document.addEventListener("keydown", (e) => {
      player.keys[e.code] = true;
      if (e.code === "KeyE") {
        if (gameState.playerInVehicle) {
          // Player is in vehicle
          return;
        } else {
          // Player is on ground, show nearby vehicles
          showVehicleSelectPanel();
        }
      }
      if (e.code === "KeyX") {
        if (gameState.playerInVehicle) {
          exitVehicle();
        }
      }
    });

    document.addEventListener("keyup", (e) => {
      player.keys[e.code] = false;
    });

    ui.exitBtn.addEventListener("click", () => {
      exitVehicle();
    });

    function updatePlayer(dt) {
      if (gameState.playerInVehicle) {
        operateVehicle(gameState.playerInVehicle, dt);
        return;
      }

      const fwd = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

      let move = new THREE.Vector3();
      if (player.keys["KeyW"]) move.addScaledVector(fwd, 1);
      if (player.keys["KeyS"]) move.addScaledVector(fwd, -1);
      if (player.keys["KeyA"]) move.addScaledVector(right, -1);
      if (player.keys["KeyD"]) move.addScaledVector(right, 1);

      const sprint = player.keys["ShiftLeft"] || player.keys["ShiftRight"] ? 1.4 : 1;
      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(player.moveSpeed * sprint * dt);
        player.pos.add(move);
      }

      player.pos.x = Math.max(-95, Math.min(95, player.pos.x));
      player.pos.z = Math.max(-95, Math.min(95, player.pos.z));

      camera.position.copy(player.pos);
      camera.rotation.order = "YXZ";
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
    }

    // ========== CHAT COMMANDS ==========
    function handleChat(text) {
      const cmd = text.toLowerCase();

      if (cmd.includes("status")) {
        addChatMessage("Dispatch", `Status: ${gameState.fires.length} fires, ${gameState.civilians.length} civs, ${gameState.vehicles.length} units ready.`);
        return;
      }
      if (cmd.includes("air")) {
        addChatMessage("Dispatch", "Air support: helicopter and planes dispatched to major fire.");
        addDispatchMessage("Air units deployed", "good");
        return;
      }
      if (cmd.includes("ground")) {
        addChatMessage("Dispatch", "Ground crew: trucks and engines heading to nearest fire.");
        addDispatchMessage("Ground units deployed", "good");
        return;
      }
      if (cmd.includes("evacuate")) {
        addChatMessage("Dispatch", "Evacuation routes opened. Civilians moving to safe zones.");
        addDispatchMessage("Evacuation in progress", "good");
        return;
      }
      if (cmd.includes("help")) {
        showHelp();
        addChatMessage("Dispatch", "Commands: status, air, ground, evacuate, deploy truck, save civilians");
        return;
      }
      if (cmd.includes("deploy truck")) {
        addChatMessage("Dispatch", "Truck deployed with full water capacity.");
        addDispatchMessage("Truck dispatched", "good");
        return;
      }
      if (cmd.includes("save")) {
        addChatMessage("Dispatch", "Civilian rescue in progress. Moving people to safe perimeter.");
        return;
      }

      addChatMessage("Dispatch", "Copy. Try: status, air, ground, evacuate, deploy truck, save civilians");
    }

    ui.chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const text = ui.chatInput.value.trim();
        if (text) {
          addChatMessage("You", text);
          handleChat(text);
          ui.chatInput.value = "";
        }
      }
    });

    document.getElementById("sendBtn").addEventListener("click", () => {
      const text = ui.chatInput.value.trim();
      if (text) {
        addChatMessage("You", text);
        handleChat(text);
        ui.chatInput.value = "";
      }
    });

    document.querySelectorAll(".cmd-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const cmd = btn.dataset.cmd;
        const texts = {
          "status": "status",
          "air": "air support",
          "ground": "ground crew",
          "help": "help"
        };
        addChatMessage("You", texts[cmd]);
        handleChat(texts[cmd]);
      });
    });

    // ========== MINIMAP ==========
    const minimapCanvas = document.getElementById("minimapCanvas");
    const minimapCtx = minimapCanvas.getContext("2d", { alpha: true });

    function drawMinimap() {
      const w = minimapCanvas.width = 200;
      const h = minimapCanvas.height = 140;

      minimapCtx.fillStyle = "#0a1420";
      minimapCtx.fillRect(0, 0, w, h);

      minimapCtx.strokeStyle = "rgba(255,255,255,0.15)";
      minimapCtx.lineWidth = 1;
      minimapCtx.strokeRect(2, 2, w - 4, h - 4);

      // Player
      const px = ((player.pos.x + 100) / 200) * w;
      const py = ((player.pos.z + 100) / 200) * h;
      minimapCtx.fillStyle = gameState.playerInVehicle ? "#ffff00" : "#fff";
      minimapCtx.beginPath();
      minimapCtx.arc(px, py, 3, 0, Math.PI * 2);
      minimapCtx.fill();

      // Fires
      for (const fire of gameState.fires) {
        const fx = ((fire.x + 100) / 200) * w;
        const fy = ((fire.z + 100) / 200) * h;
        minimapCtx.fillStyle = "#ff5555";
        minimapCtx.fillRect(fx - 2, fy - 2, 4, 4);
      }

      // Fuel
      for (const st of gameState.fuelStations) {
        const sx = ((st.x + 100) / 200) * w;
        const sy = ((st.z + 100) / 200) * h;
        minimapCtx.fillStyle = "#77dd77";
        minimapCtx.fillRect(sx - 2, sy - 2, 4, 4);
      }

      // Pumps
      for (const pump of gameState.firePumps) {
        const px2 = ((pump.x + 100) / 200) * w;
        const py2 = ((pump.z + 100) / 200) * h;
        minimapCtx.fillStyle = "#4ab8ff";
        minimapCtx.fillRect(px2 - 2, py2 - 2, 4, 4);
      }
    }

    // ========== LIGHTING ==========
    const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(40, 50, 30);
    scene.add(dirLight);

    // ========== ANIMATION LOOP ==========
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePlayer(dt);
      updateFireSpread(dt);
      updateCivilians(dt);

      for (const v of gameState.vehicles) {
        updateVehicleAI(v, dt);
      }

      updateHud();
      drawMinimap();

      const now = performance.now();
      if (now - gameState.lastDispatchTime > 8000) {
        gameState.lastDispatchTime = now;
        addDispatchMessage(`${gameState.fires.length} active fires in district`, gameState.fires.length > 5 ? "danger" : "info");
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    addChatMessage("Dispatch", "Firestorm Response online. Press E to board a vehicle. Units standing by. Type 'help' for commands.");
    addDispatchMessage("System ready", "good");
    animate();
  </script>
</body>
</html>
